<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Painel de Monitoramento de Estratégias</title>
    
    <!-- TAGS ANTI-CACHE SEVERAS -->
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
    <meta http-equiv="Pragma" content="no-cache" />
    <meta http-equiv="Expires" content="0" />

    <style>
        :root {
            --bg-dark: #121418;
            --card-bg: #1e222d;
            --accent-blue: #2962ff;
            --green-gain: #089981;
            --red-loss: #f23645;
            --text-main: #d1d4dc;
            --text-sub: #787b86;
            --border-color: #2a2e39;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg-dark);
            color: var(--text-main);
            margin: 0;
            padding: 20px;
        }

        .header {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 15px;
            padding-bottom: 20px;
            border-bottom: 1px solid var(--border-color);
            margin-bottom: 20px;
            text-align: center;
        }

        .header h1 {
            margin: 0;
            font-size: 1.6rem;
            color: #fff;
        }

        .filters-container {
            display: flex;
            gap: 12px;
            align-items: center;
            justify-content: center;
            flex-wrap: wrap;
            width: 100%;
        }

        .filter-group {
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .filter-group label {
            color: var(--text-sub);
            font-size: 0.85rem;
            font-weight: 600;
            text-transform: uppercase;
        }

        .strategy-selector {
            background-color: var(--card-bg);
            color: var(--text-main);
            border: 1px solid var(--border-color);
            padding: 8px 12px;
            border-radius: 6px;
            font-size: 0.9rem;
            outline: none;
            cursor: pointer;
        }

        .strategy-selector:focus {
            border-color: var(--accent-blue);
        }

        @media (max-width: 768px) {
            body { padding: 12px; }
            .header h1 { font-size: 1.25rem; }
            .filters-container { flex-direction: column; align-items: stretch; }
            .filter-group { justify-content: space-between; }
            .strategy-selector { width: 60%; }
        }

        .metrics-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(170px, 1fr));
            gap: 15px;
            margin-bottom: 25px;
        }

        .metric-card {
            background-color: var(--card-bg);
            padding: 18px;
            border-radius: 8px;
            border: 1px solid var(--border-color);
        }

        .metric-card .title {
            font-size: 0.8rem;
            color: var(--text-sub);
            margin-bottom: 8px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .metric-card .value {
            font-size: 1.5rem;
            font-weight: bold;
        }

        .gain { color: var(--green-gain); }
        .loss { color: var(--red-loss); }

        .table-container {
            background-color: var(--card-bg);
            border-radius: 8px;
            border: 1px solid var(--border-color);
            padding: 20px;
            overflow-x: auto;
        }

        .table-title {
            margin-top: 0;
            margin-bottom: 15px;
            font-size: 1.1rem;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            text-align: left;
        }

        th {
            color: var(--text-sub);
            font-weight: 600;
            padding: 12px;
            border-bottom: 1px solid var(--border-color);
            font-size: 0.85rem;
            text-transform: uppercase;
        }

        td {
            padding: 12px;
            border-bottom: 1px solid var(--border-color);
            font-size: 0.9rem;
        }

        tr:hover {
            background-color: rgba(255, 255, 255, 0.02);
        }

        .badge {
            padding: 4px 8px;
            border-radius: 4px;
            font-size: 0.75rem;
            font-weight: bold;
        }

        .badge-buy { background-color: rgba(8, 153, 129, 0.2); color: var(--green-gain); }
        .badge-sell { background-color: rgba(242, 54, 69, 0.2); color: var(--red-loss); }
    </style>
</head>
<body>

    <div class="header">
        <h1>📊 Monitor de Estratégias 📊</h1>
        <div class="filters-container">
            
            <!-- Filtro 1: Ativo -->
            <div class="filter-group">
                <label for="assetFilter">Ativo:</label>
                <select id="assetFilter" class="strategy-selector">
                    <option value="ALL">Todos os Ativos</option>
                    <option value="WDO">WDO (Dólar)</option>
                    <option value="WIN">WIN (Índice)</option>
                </select>
            </div>

            <!-- Filtro 2: Mês -->
            <div class="filter-group">
                <label for="monthFilter">Mês:</label>
                <select id="monthFilter" class="strategy-selector">
                    <option value="ALL">Todos os Meses</option>
                    <option value="JANEIRO">Janeiro</option>
                    <option value="FEVEREIRO">Fevereiro</option>
                    <option value="MARCO">Março</option>
                    <option value="ABRIL">Abril</option>
                    <option value="MAIO">Maio</option>
                    <option value="JUNHO">Junho</option>
                    <option value="JULHO">Julho</option>
                    <option value="AGOSTO">Agosto</option>
                    <option value="SETEMBRO">Setembro</option>
                    <option value="OUTUBRO">Outubro</option>
                    <option value="NOVEMBRO">Novembro</option>
                    <option value="DEZEMBRO">Dezembro</option>
                </select>
            </div>

            <!-- Filtro 3: Período -->
            <div class="filter-group">
                <label for="periodFilter">Período:</label>
                <select id="periodFilter" class="strategy-selector">
                    <option value="ALL">Todos os Períodos</option>
                    <option value="DIARIO">Diário</option>
                    <option value="SEMANAL">Semanal</option>
                    <option value="MENSAL">Mensal</option>
                </select>
            </div>

            <!-- Filtro 4: Relatório / Arquivo -->
            <div class="filter-group">
                <label for="strategyFilter">Relatório / Arquivo:</label>
                <select id="strategyFilter" class="strategy-selector">
                    <option value="ALL">Todas as Estratégias</option>
                </select>
            </div>

        </div>
    </div>

    <div class="metrics-grid">
        <div class="metric-card">
            <div class="title">Resultado do Período</div>
            <div class="value" id="totalPnl">R$ 0.00</div>
        </div>
        <div class="metric-card">
            <div class="title">Taxa de Acerto (Win Rate)</div>
            <div class="value" id="winRate">0.0%</div>
        </div>
        <div class="metric-card">
            <div class="title">Operações Gain</div>
            <div class="value gain" id="gainCount">0</div>
        </div>
        <div class="metric-card">
            <div class="title">Operações Loss</div>
            <div class="value loss" id="lossCount">0</div>
        </div>
        <div class="metric-card">
            <div class="title">Total de Operações</div>
            <div class="value" id="totalTrades">0</div>
        </div>
        <div class="metric-card">
            <div class="title">Fator de Lucro (Payoff)</div>
            <div class="value" id="payoff">0.00</div>
        </div>
    </div>

    <div class="table-container">
        <h2 class="table-title">Histórico de Operações</h2>
        <table>
            <thead>
                <tr>
                    <th>Horário</th>
                    <th>Estratégia</th>
                    <th>Ativo</th>
                    <th>Tipo</th>
                    <th>Qtd</th>
                    <th>Resultado (R$)</th>
                </tr>
            </thead>
            <tbody id="tradesTableBody">
                <!-- Preenchido via JS -->
            </tbody>
        </table>
    </div>

    <script>
        let allTrades = [];

        // Mapeamento Inteligente dos Meses
        const monthConfig = {
            'JANEIRO':   ['JANEIRO', 'JAN', '-01-', '/01/', '-01', '01-'],
            'FEVEREIRO': ['FEVEREIRO', 'FEV', '-02-', '/02/', '-02', '02-'],
            'MARCO':     ['MARCO', 'MARÇO', 'MAR', '-03-', '/03/', '-03', '03-'],
            'ABRIL':     ['ABRIL', 'ABR', '-04-', '/04/', '-04', '04-'],
            'MAIO':      ['MAIO', 'MAI', '-05-', '/05/', '-05', '05-'],
            'JUNHO':     ['JUNHO', 'JUN', '-06-', '/06/', '-06', '06-'],
            'JULHO':     ['JULHO', 'JUL', '-07-', '/07/', '-07', '07-'],
            'AGOSTO':    ['AGOSTO', 'AGO', '-08-', '/08/', '-08', '08-', '28-08'],
            'SETEMBRO':  ['SETEMBRO', 'SET', '-09-', '/09/', '-09', '09-'],
            'OUTUBRO':   ['OUTUBRO', 'OUT', '-10-', '/10/', '-10', '10-'],
            'NOVEMBRO':  ['NOVEMBRO', 'NOV', '-11-', '/11/', '-11', '11-'],
            'DEZEMBRO':  ['DEZEMBRO', 'DEZ', '-12-', '/12/', '-12', '12-']
        };

        function formatarMoeda(valor) {
            const partes = Math.abs(valor).toFixed(2).split('.');
            partes[0] = partes[0].replace(/\B(?=(\d{3})+(?!\d))/g, ".");
            const sinal = valor < 0 ? '-' : '';
            return `${sinal}R$ ${partes[0]}.${partes[1]}`;
        }

        function getCategory(stratName) {
            const name = (stratName || '').toUpperCase();
            if (name.includes('MENSAL')) return 'MENSAL';
            if (name.includes('SEMANAL')) return 'SEMANAL';
            return 'DIARIO';
        }

        function matchesAsset(trade, selectedAsset) {
            if (selectedAsset === 'ALL') return true;
            const assetName = (trade.asset || '').toUpperCase();
            const stratName = (trade.strategy || '').toUpperCase();
            return assetName.includes(selectedAsset) || stratName.includes(selectedAsset);
        }

        function matchesMonth(trade, selectedMonth) {
            if (selectedMonth === 'ALL') return true;
            const keys = monthConfig[selectedMonth] || [selectedMonth];
            const textToSearch = `${trade.strategy || ''} ${trade.time || ''}`.toUpperCase();
            return keys.some(key => textToSearch.includes(key));
        }

      async function loadData() {
    try {
        // Adiciona timestamp dinâmico para EVITAR CACHE do navegador
        const cacheBuster = new Date().getTime();
        
        // Força a busca do JSON atualizado no disco sem armazenar em cache
        const response = await fetch(`trades_data.json?v=${cacheBuster}`, { cache: 'no-store' });
        
        if (!response.ok) throw new Error('Erro ao carregar os dados');
        allTrades = await response.json();
        
        setupFilters();
        renderDashboard();
    } catch (error) {
        console.error("Erro ao carregar trades_data.json:", error);
    }
}

        function setupFilters() {
            const assetSelect = document.getElementById('assetFilter');
            const monthSelect = document.getElementById('monthFilter');
            const periodSelect = document.getElementById('periodFilter');
            const strategySelect = document.getElementById('strategyFilter');

            function updateStrategyDropdown() {
                const selectedAsset = assetSelect.value;
                const selectedMonth = monthSelect.value;
                const selectedPeriod = periodSelect.value;

                let filtered = allTrades.filter(t => matchesAsset(t, selectedAsset));

                if (selectedMonth !== 'ALL') {
                    filtered = filtered.filter(t => matchesMonth(t, selectedMonth));
                }

                if (selectedPeriod !== 'ALL') {
                    filtered = filtered.filter(t => getCategory(t.strategy) === selectedPeriod);
                }

                const strategies = [...new Set(filtered.map(t => t.strategy))];
                
                strategySelect.innerHTML = '<option value="ALL">Todas as Estratégias</option>';
                strategies.forEach(strat => {
                    const option = document.createElement('option');
                    option.value = strat;
                    option.textContent = strat;
                    strategySelect.appendChild(option);
                });
            }

            assetSelect.addEventListener('change', () => { updateStrategyDropdown(); renderDashboard(); });
            monthSelect.addEventListener('change', () => { updateStrategyDropdown(); renderDashboard(); });
            periodSelect.addEventListener('change', () => { updateStrategyDropdown(); renderDashboard(); });
            strategySelect.addEventListener('change', () => { renderDashboard(); });

            updateStrategyDropdown();
        }

        function renderDashboard() {
            const selectedAsset = document.getElementById('assetFilter').value;
            const selectedMonth = document.getElementById('monthFilter').value;
            const selectedPeriod = document.getElementById('periodFilter').value;
            const selectedStrategy = document.getElementById('strategyFilter').value;

            let filteredTrades = allTrades.filter(t => matchesAsset(t, selectedAsset));

            if (selectedMonth !== 'ALL') {
                filteredTrades = filteredTrades.filter(t => matchesMonth(t, selectedMonth));
            }

            if (selectedPeriod !== 'ALL') {
                filteredTrades = filteredTrades.filter(t => getCategory(t.strategy) === selectedPeriod);
            }

            if (selectedStrategy !== 'ALL') {
                filteredTrades = filteredTrades.filter(t => t.strategy === selectedStrategy);
            }

            // Cálculos
            const totalPnl = filteredTrades.reduce((acc, t) => acc + t.pnl, 0);
            const gains = filteredTrades.filter(t => t.pnl > 0);
            const losses = filteredTrades.filter(t => t.pnl < 0);
            const totalTradesCount = filteredTrades.length;
            
            const winRate = totalTradesCount > 0 ? ((gains.length / totalTradesCount) * 100).toFixed(1) : 0.0;
            
            const sumGain = gains.reduce((acc, t) => acc + t.pnl, 0);
            const sumLoss = Math.abs(losses.reduce((acc, t) => acc + t.pnl, 0));
            
            let payoff = "0.00";
            if (sumLoss > 0) {
                payoff = (sumGain / sumLoss).toFixed(2);
            } else if (sumGain > 0) {
                payoff = "∞";
            }

            // Atualização dos Cartões
            const pnlElement = document.getElementById('totalPnl');
            pnlElement.textContent = formatarMoeda(totalPnl);
            pnlElement.className = `value ${totalPnl >= 0 ? 'gain' : 'loss'}`;

            document.getElementById('winRate').textContent = `${winRate}%`;
            document.getElementById('gainCount').textContent = gains.length;
            document.getElementById('lossCount').textContent = losses.length;
            document.getElementById('totalTrades').textContent = totalTradesCount;
            document.getElementById('payoff').textContent = payoff;

            // Atualização da Tabela
            const tbody = document.getElementById('tradesTableBody');
            tbody.innerHTML = '';

            filteredTrades.forEach((trade, index) => {
                const tr = document.createElement('tr');
                
                const isGain = trade.pnl >= 0;
                const pnlClass = isGain ? 'gain' : 'loss';
                const badgeClass = trade.type === 'COMPRA' ? 'badge-buy' : 'badge-sell';

                tr.innerHTML = `
                    <td>${trade.time || `Trade #${index + 1}`}</td>
                    <td><strong>${trade.strategy}</strong></td>
                    <td>${trade.asset || 'WIN'}</td>
                    <td><span class="badge ${badgeClass}">${trade.type}</span></td>
                    <td>${trade.qty || 1}</td>
                    <td class="${pnlClass}"><strong>${formatarMoeda(trade.pnl)}</strong></td>
                `;
                tbody.appendChild(tr);
            });
        }

        loadData();
    </script>
</body>
</html>
