<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Painel de Monitoramento de Estratégias</title>
    <style>
        :root {
            --bg-dark: #121418;
            --card-bg: #1e222d;
            --accent-blue: #2962ff;
            --green-gain: #089981;
            --red-loss: #f23645;
            --text-main: #d1d4dc;
            --text-sub: #787b86;
            --border-color: #2a2e39;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg-dark);
            color: var(--text-main);
            margin: 0;
            padding: 20px;
        }

        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding-bottom: 20px;
            border-bottom: 1px solid var(--border-color);
            margin-bottom: 20px;
        }

        .header h1 {
            margin: 0;
            font-size: 1.5rem;
            color: #fff;
        }

        .strategy-selector {
            background-color: var(--card-bg);
            color: var(--text-main);
            border: 1px solid var(--border-color);
            padding: 10px 15px;
            border-radius: 6px;
            font-size: 1rem;
            outline: none;
            cursor: pointer;
        }

        .metrics-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 15px;
            margin-bottom: 25px;
        }

        .metric-card {
            background-color: var(--card-bg);
            padding: 18px;
            border-radius: 8px;
            border: 1px solid var(--border-color);
        }

        .metric-card .title {
            font-size: 0.85rem;
            color: var(--text-sub);
            margin-bottom: 8px;
            text-transform: uppercase;
        }

        .metric-card .value {
            font-size: 1.6rem;
            font-weight: bold;
        }

        .gain { color: var(--green-gain); }
        .loss { color: var(--red-loss); }

        .table-container {
            background-color: var(--card-bg);
            border-radius: 8px;
            border: 1px solid var(--border-color);
            padding: 20px;
            overflow-x: auto;
        }

        .table-title {
            margin-top: 0;
            margin-bottom: 15px;
            font-size: 1.1rem;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            text-align: left;
        }

        th {
            color: var(--text-sub);
            font-weight: 500;
            padding: 12px;
            border-bottom: 1px solid var(--border-color);
            font-size: 0.9rem;
        }

        td {
            padding: 12px;
            border-bottom: 1px solid var(--border-color);
            font-size: 0.95rem;
        }

        tr:hover {
            background-color: rgba(255, 255, 255, 0.02);
        }

        .badge {
            padding: 4px 8px;
            border-radius: 4px;
            font-size: 0.8rem;
            font-weight: bold;
        }

        .badge-buy { background-color: rgba(8, 153, 129, 0.2); color: var(--green-gain); }
        .badge-sell { background-color: rgba(242, 54, 69, 0.2); color: var(--red-loss); }
    </style>
</head>
<body>

    <div class="header">
        <h1>📊 Monitor de Estratégias - Profit Pro</h1>
        <div>
            <label for="strategySelect" style="color: var(--text-sub); font-size: 0.9rem; margin-right: 8px;">Filtrar Estratégia:</label>
            <select id="strategySelect" class="strategy-selector" onchange="filterStrategy()">
                <option value="ALL">Todas as Estratégias (Consolidado)</option>
            </select>
        </div>
    </div>

    <!-- Métricas Globais ou Filtradas -->
    <div class="metrics-grid">
        <div class="metric-card">
            <div class="title">Resultado do Dia</div>
            <div class="value" id="totalPnl">R$ 0,00</div>
        </div>
        <div class="metric-card">
            <div class="title">Taxa de Acerto (Win Rate)</div>
            <div class="value" id="winRate">0%</div>
        </div>
        <div class="metric-card">
            <div class="title">Total de Operações</div>
            <div class="value" id="totalTrades">0</div>
        </div>
        <div class="metric-card">
            <div class="title">Fator de Lucro (Payoff)</div>
            <div class="value" id="payoff">0.00</div>
        </div>
    </div>

    <!-- Tabela de Trades -->
    <div class="table-container">
        <h3 class="table-title">Histórico de Operações</h3>
        <table>
            <thead>
                <tr>
                    <th>Horário</th>
                    <th>Estratégia</th>
                    <th>Ativo</th>
                    <th>Tipo</th>
                    <th>Qtd</th>
                    <th>Resultado (R$)</th>
                </tr>
            </thead>
            <tbody id="tradeHistory">
                <!-- Preenchido via JavaScript -->
            </tbody>
        </table>
    </div>

    <script>
        let tradesData = [];

        // Busca dados reais gerados pelo Python
        async function loadTradesData() {
            try {
                const response = await fetch('trades_data.json?t=' + new Date().getTime());
                if (response.ok) {
                    tradesData = await response.json();
                    updateStrategyDropdown();
                    filterStrategy();
                }
            } catch (error) {
                console.log("Aguardando geração do trades_data.json...");
            }
        }

        // Atualiza o menu de filtro conforme as estratégias encontradas no arquivo
        function updateStrategyDropdown() {
            const select = document.getElementById("strategySelect");
            const currentValue = select.value;
            
            const strategies = [...new Set(tradesData.map(t => t.strategy))];
            
            select.innerHTML = '<option value="ALL">Todas as Estratégias (Consolidado)</option>';
            
            strategies.forEach(strat => {
                const option = document.createElement("option");
                option.value = strat;
                option.textContent = strat;
                select.appendChild(option);
            });

            if (strategies.includes(currentValue)) {
                select.value = currentValue;
            }
        }

        function filterStrategy() {
            const selected = document.getElementById("strategySelect").value;
            const filtered = selected === "ALL" 
                ? tradesData 
                : tradesData.filter(t => t.strategy === selected);

            renderMetrics(filtered);
            renderTable(filtered);
        }

        function renderMetrics(trades) {
            if (!trades || trades.length === 0) {
                document.getElementById("totalPnl").innerText = "R$ 0,00";
                document.getElementById("winRate").innerText = "0%";
                document.getElementById("totalTrades").innerText = "0";
                document.getElementById("payoff").innerText = "0.00";
                return;
            }

            const totalPnl = trades.reduce((acc, t) => acc + t.pnl, 0);
            const wins = trades.filter(t => t.pnl > 0);
            const losses = trades.filter(t => t.pnl < 0);
            
            const winRate = ((wins.length / trades.length) * 100).toFixed(1);
            
            const grossProfit = wins.reduce((acc, t) => acc + t.pnl, 0);
            const grossLoss = Math.abs(losses.reduce((acc, t) => acc + t.pnl, 0));
            const payoff = grossLoss === 0 ? grossProfit.toFixed(2) : (grossProfit / grossLoss).toFixed(2);

            const pnlElement = document.getElementById("totalPnl");
            pnlElement.innerText = `R$ ${totalPnl.toFixed(2)}`;
            pnlElement.className = `value ${totalPnl >= 0 ? 'gain' : 'loss'}`;

            document.getElementById("winRate").innerText = `${winRate}%`;
            document.getElementById("totalTrades").innerText = trades.length;
            document.getElementById("payoff").innerText = payoff;
        }

        function renderTable(trades) {
            const tbody = document.getElementById("tradeHistory");
            tbody.innerHTML = "";

            trades.forEach(t => {
                const row = document.createElement("tr");
                const badgeClass = t.type === "COMPRA" ? "badge-buy" : "badge-sell";
                const pnlClass = t.pnl >= 0 ? "gain" : "loss";

                row.innerHTML = `
                    <td>${t.time}</td>
                    <td><strong>${t.strategy}</strong></td>
                    <td>${t.asset}</td>
                    <td><span class="badge ${badgeClass}">${t.type}</span></td>
                    <td>${t.qty}</td>
                    <td class="${pnlClass}"><strong>R$ ${t.pnl.toFixed(2)}</strong></td>
                `;
                tbody.appendChild(row);
            });
        }

        // Checa por atualizações a cada 3 segundos
        setInterval(loadTradesData, 3000);
        loadTradesData();
    </script>
</body>
</html>
