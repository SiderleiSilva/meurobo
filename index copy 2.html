<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Painel de Monitoramento de Estratégias</title>
    
    <!-- TAGS ANTI-CACHE: Para carregar sempre a versão mais recente -->
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
    <meta http-equiv="Pragma" content="no-cache" />
    <meta http-equiv="Expires" content="0" />

    <style>
        :root {
            --bg-dark: #121418;
            --card-bg: #1e222d;
            --accent-blue: #2962ff;
            --green-gain: #089981;
            --red-loss: #f23645;
            --text-main: #d1d4dc;
            --text-sub: #787b86;
            --border-color: #2a2e39;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg-dark);
            color: var(--text-main);
            margin: 0;
            padding: 20px;
        }

        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding-bottom: 20px;
            border-bottom: 1px solid var(--border-color);
            margin-bottom: 20px;
        }

        .header h1 {
            margin: 0;
            font-size: 1.5rem;
            color: #fff;
        }

        .strategy-selector {
            background-color: var(--card-bg);
            color: var(--text-main);
            border: 1px solid var(--border-color);
            padding: 10px 15px;
            border-radius: 6px;
            font-size: 1rem;
            outline: none;
            cursor: pointer;
        }

        .metrics-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
            gap: 15px;
            margin-bottom: 25px;
        }

        .metric-card {
            background-color: var(--card-bg);
            padding: 18px;
            border-radius: 8px;
            border: 1px solid var(--border-color);
        }

        .metric-card .title {
            font-size: 0.85rem;
            color: var(--text-sub);
            margin-bottom: 8px;
            text-transform: uppercase;
        }

        .metric-card .value {
            font-size: 1.6rem;
            font-weight: bold;
        }

        .gain { color: var(--green-gain); }
        .loss { color: var(--red-loss); }

        .table-container {
            background-color: var(--card-bg);
            border-radius: 8px;
            border: 1px solid var(--border-color);
            padding: 20px;
            overflow-x: auto;
        }

        .table-title {
            margin-top: 0;
            margin-bottom: 15px;
            font-size: 1.1rem;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            text-align: left;
        }

        th {
            color: var(--text-sub);
            font-weight: 500;
            padding: 12px;
            border-bottom: 1px solid var(--border-color);
            font-size: 0.9rem;
        }

        td {
            padding: 12px;
            border-bottom: 1px solid var(--border-color);
            font-size: 0.95rem;
        }

        tr:hover {
            background-color: rgba(255, 255, 255, 0.02);
        }

        .badge {
            padding: 4px 8px;
            border-radius: 4px;
            font-size: 0.8rem;
            font-weight: bold;
        }

        .badge-buy { background-color: rgba(8, 153, 129, 0.2); color: var(--green-gain); }
        .badge-sell { background-color: rgba(242, 54, 69, 0.2); color: var(--red-loss); }
    </style>
</head>
<body>

    <div class="header">
        <h1>📊 Monitor de Estratégias - Profit Pro</h1>
        <div>
            <label for="strategyFilter" style="color: var(--text-sub); margin-right: 10px;">Filtrar Estratégia:</label>
            <select id="strategyFilter" class="strategy-selector">
                <option value="ALL">Todas as Estratégias (Consolidado)</option>
            </select>
        </div>
    </div>

    <div class="metrics-grid">
        <div class="metric-card">
            <div class="title">Resultado do Dia</div>
            <div class="value" id="totalPnl">R$ 0.00</div>
        </div>
        <div class="metric-card">
            <div class="title">Taxa de Acerto (Win Rate)</div>
            <div class="value" id="winRate">0.0%</div>
        </div>
        <div class="metric-card">
            <div class="title">Operações Gain</div>
            <div class="value gain" id="gainCount">0</div>
        </div>
        <div class="metric-card">
            <div class="title">Operações Loss</div>
            <div class="value loss" id="lossCount">0</div>
        </div>
        <div class="metric-card">
            <div class="title">Total de Operações</div>
            <div class="value" id="totalTrades">0</div>
        </div>
        <div class="metric-card">
            <div class="title">Fator de Lucro (Payoff)</div>
            <div class="value" id="payoff">0.00</div>
        </div>
    </div>

    <div class="table-container">
        <h2 class="table-title">Histórico de Operações</h2>
        <table>
            <thead>
                <tr>
                    <th>Horário</th>
                    <th>Estratégia</th>
                    <th>Ativo</th>
                    <th>Tipo</th>
                    <th>Qtd</th>
                    <th>Resultado (R$)</th>
                </tr>
            </thead>
            <tbody id="tradesTableBody">
                <!-- Preenchido via JavaScript -->
            </tbody>
        </table>
    </div>

    <script>
        let allTrades = [];

        async function loadData() {
            try {
                const response = await fetch('trades_data.json?t=' + new Date().getTime());
                if (!response.ok) throw new Error('Erro ao carregar os dados');
                allTrades = await response.json();
                
                populateStrategyFilter();
                renderDashboard('ALL');
            } catch (error) {
                console.error("Erro na requisição:", error);
            }
        }

        function populateStrategyFilter() {
            const select = document.getElementById('strategyFilter');
            const strategies = [...new Set(allTrades.map(t => t.strategy))];
            
            select.innerHTML = '<option value="ALL">Todas as Estratégias (Consolidado)</option>';
            
            strategies.forEach(strat => {
                const option = document.createElement('option');
                option.value = strat;
                option.textContent = strat;
                select.appendChild(option);
            });

            select.addEventListener('change', (e) => {
                renderDashboard(e.target.value);
            });
        }

        function renderDashboard(selectedStrategy) {
            const filteredTrades = selectedStrategy === 'ALL' 
                ? allTrades 
                : allTrades.filter(t => t.strategy === selectedStrategy);

            // Cálculos das métricas
            const totalPnl = filteredTrades.reduce((acc, t) => acc + t.pnl, 0);
            const gains = filteredTrades.filter(t => t.pnl > 0);
            const losses = filteredTrades.filter(t => t.pnl < 0);
            const totalTradesCount = filteredTrades.length;
            
            const winRate = totalTradesCount > 0 ? ((gains.length / totalTradesCount) * 100).toFixed(1) : 0.0;
            
            const sumGain = gains.reduce((acc, t) => acc + t.pnl, 0);
            const sumLoss = Math.abs(losses.reduce((acc, t) => acc + t.pnl, 0));
            
            let payoff = "0.00";
            if (sumLoss > 0) {
                payoff = (sumGain / sumLoss).toFixed(2);
            } else if (sumGain > 0) {
                payoff = "∞";
            }

            // Atualizar DOM - Métricas
            const pnlElement = document.getElementById('totalPnl');
            pnlElement.textContent = `R$ ${totalPnl.toFixed(2)}`;
            pnlElement.className = `value ${totalPnl >= 0 ? 'gain' : 'loss'}`;

            document.getElementById('winRate').textContent = `${winRate}%`;
            document.getElementById('gainCount').textContent = gains.length;
            document.getElementById('lossCount').textContent = losses.length;
            document.getElementById('totalTrades').textContent = totalTradesCount;
            document.getElementById('payoff').textContent = payoff;

            // Renderizar Tabela
            const tbody = document.getElementById('tradesTableBody');
            tbody.innerHTML = '';

            filteredTrades.forEach((trade, index) => {
                const tr = document.createElement('tr');
                
                const isGain = trade.pnl >= 0;
                const pnlClass = isGain ? 'gain' : 'loss';
                const badgeClass = trade.type === 'COMPRA' ? 'badge-buy' : 'badge-sell';

                tr.innerHTML = `
                    <td>${trade.time || `Trade #${index + 1}`}</td>
                    <td><strong>${trade.strategy}</strong></td>
                    <td>${trade.asset || 'WIN'}</td>
                    <td><span class="badge ${badgeClass}">${trade.type}</span></td>
                    <td>${trade.qty || 1}</td>
                    <td class="${pnlClass}"><strong>R$ ${trade.pnl.toFixed(2)}</strong></td>
                `;
                tbody.appendChild(tr);
            });
        }

        // Inicia o carregamento dos dados
        loadData();
    </script>
</body>
</html>
